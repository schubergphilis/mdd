StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = mdd

# Pinned release, not `@latest` - see S06's Vale implementation note.
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

# `filter_mode = added` (only lint new content) does not exist as a
# `.vale.ini` key in Vale 3, and `vale --help`'s `--filter` flag filters
# *which rules* run, not *which lines* they run over - there is no built-in
# "only new content" mode to configure here. Achieving that would mean
# diffing against `main` outside Vale (e.g. in the calling `mise` task or
# workflow) and passing only changed files/line ranges to `vale`. Left
# unimplemented for now; `MinAlertLevel = warning` is the whole gate.
[*.md]
BasedOnStyles = Vale

# Named individually rather than adding the whole `write-good` style, which
# enables it without pulling in the package's other seven rules.
write-good.Passive = YES
write-good.Cliches = YES
