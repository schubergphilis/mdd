# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>`
# dispatches to `uv`. `pyproject.toml`'s `requires-python` remains
# authoritative — mise reads it.

[tools]
python = "3.14"
uv = "latest"
# Documentation site only. `mise run ci` never touches these, so a contributor
# working on Python pays nothing for them beyond `mise install`.
bun = "1.3"
vale = "3"

[env]
_.file = { path = ".env", optional = true }

[tasks.install]
description = "uv sync (all groups)"
run = "uv sync --all-groups"

[tasks.lint]
description = "ruff check + ruff format --check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.format]
description = "ruff format + ruff check --fix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.typecheck]
description = "basedpyright strict"
run = "uv run basedpyright"

[tasks.complexipy]
description = "complexipy cognitive-complexity gate (uses complexipy-snapshot.json for grandfathering)"
run = "uv run complexipy src/mdd"

[tasks.complexipy-snapshot]
description = "Regenerate complexipy-snapshot.json baseline. Use only for deliberate refactor PRs."
run = "uv run complexipy --snapshot-create src/mdd"

[tasks.verify-clean]
description = "Fail if any tracked file contains git conflict markers"
run = "python3 scripts/verify-clean.py"

[tasks.test]
description = "Unit tests (no external services, no Microsoft Office)"
run = "uv run python -m pytest -m \"not integration and not office\""

[tasks.test-integration]
description = "Integration tests — talk to Confluence / SharePoint / an LLM gateway"
run = "uv run python -m pytest -m integration --no-cov"

[tasks.test-office]
description = "Office tests — require Microsoft Office installed locally (macOS)"
run = "uv run python -m pytest -m office --no-cov"

[tasks.test-all]
description = "Every test — unit + integration + office (needs services and Office)"
run = "uv run python -m pytest -m \"\""

[tasks.audit]
description = "pip-audit (OSV) over the dependency closure"
# pip-audit >= 2.10 rejects --disable-pip unless it is paired with -r, and CI
# logs are not a terminal, so the spinner goes too.
run = "uv run pip-audit --progress-spinner off"

[tasks.check-mdd-commands]
description = "Verify every `mdd …` string in user-facing prose is a real command"
run = "uv run python scripts/check-mdd-commands.py"

[tasks.check-mdd-commands-all]
description = "Same check, extended over the design record. Advisory: never fails."
run = "uv run python scripts/check-mdd-commands.py --all"

[tasks.ci]
description = "Full CI gate"
depends = [
  "verify-clean",
  "lint",
  "typecheck",
  "complexipy",
  "audit",
  "test",
  "ir-roundtrip",
  "ir-coverage",
  "check-mdd-commands",
]

[tasks.version]
description = "Print the resolved version (setuptools-scm, from git tags)"
run = "uv run python -c \"import mdd; print(mdd.__version__)\""

[tasks.build]
description = "Build wheel + sdist into dist/"
run = "uv build"

[tasks.new-doc-number]
description = "Print the next free spec/research number"
run = "python3 scripts/new-doc-number.py \"$@\""

[tasks.new-spec]
description = "Scaffold a new spec from docs/spec/spec-template.md"
run = "python3 scripts/new-spec.py \"$@\""

[tasks.spec-list]
description = "List specs with their status"
run = "python3 scripts/spec-list.py \"$@\""

[tasks.derive-compact-pptx]
description = "Regenerate src/mdd/templates/simple-presentation-compact.pptx from the default template"
run = "python3 scripts/derive-compact-pptx.py \"$@\""

[tasks.spec-check]
description = "Validate docs/spec/*.md hygiene"
run = "python3 scripts/spec-check.py"

[tasks.refresh-corpus]
description = "Refresh _snapshots/ under tests/corpus/confluence/ from a live Confluence instance"
run = "uv run python scripts/refresh-corpus.py \"$@\""

[tasks.test-corpus]
description = "Run the corpus-snapshot smoke test"
run = "uv run python -m pytest tests/confluence/test_corpus_smoke.py -v"

[tasks.ir-roundtrip]
description = "R1/R2/R3 IR round-trip suites (storage, markdown, full)."
run = "uv run python -m pytest tests/ir/test_r1_storage_roundtrip.py tests/ir/test_r2_markdown_roundtrip.py tests/ir/test_r3_full_roundtrip.py --no-cov -q"

[tasks.ir-roundtrip-quick]
description = "R2-only IR round-trip (under 5s)."
run = "uv run python -m pytest tests/ir/test_r2_markdown_roundtrip.py --no-cov -q"

[tasks.ir-roundtrip-bench]
description = "Benchmark gates for the IR round-trip (R3 timing)."
run = "uv run python -m pytest tests/ir/test_benchmarks.py --no-cov -v"

[tasks.ir-coverage]
description = "Corpus coverage matrix gate. Writes build/ir-coverage.json."
run = "uv run python -m pytest tests/ir/test_corpus_coverage.py --no-cov -q"

# --- Documentation site (site/, Astro + Starlight) ---------------------------
#
# None of these are part of `mise run ci`: that gate stays Node-free so a
# contributor changing Python is never asked to install bun. The code-coupled
# documentation checks (`check-mdd-commands` above) are pure Python and do run
# in `ci`, because a docs-only workflow would not fire on a Python change.

[tasks.docs-install]
description = "Install the site dependencies (bun)"
dir = "site"
run = "bun install"

[tasks.docs-sync]
description = "Copy docs/**.md into site/src/content/docs/ with Starlight frontmatter"
run = "uv run python scripts/sync-docs.py"

[tasks.docs-dev]
description = "Start the live-reloading dev server"
depends = ["docs-sync"]
dir = "site"
run = "bun run dev"

[tasks.docs-build]
description = "Build the static site into site/dist"
depends = ["docs-astro-check"]
dir = "site"
# Remove the previous build first. Astro leaves orphaned output behind when a
# page's slug changes, and the link check reads whatever is in dist/ — a stale
# page reports broken links that no longer exist in the source.
run = ["rm -rf dist", "bun run build"]

[tasks.docs-preview]
description = "Preview the production build"
dir = "site"
run = "bun run preview"

[tasks.docs-astro-check]
description = "Astro type/content check"
depends = ["docs-sync"]
dir = "site"
run = "bunx astro check"

# `check` and `build` both write under site/.astro/, so they must not run
# concurrently. mise runs `depends` in parallel, so the order is forced by
# chaining rather than by listing both under docs-check.

[tasks.docs-vale-sync]
description = "Fetch the pinned Vale style packages (needs the network)"
run = "vale sync"

[tasks.docs-vale]
description = "Vale prose lint over hand-written prose. Errors gate; warnings advise."
# Hand-written prose only. Not the design record, which is written for a
# different reader in a different register — and not the whole of
# site/src/content/docs/, because once docs-sync has run that directory
# contains the synced specs and research notes too.
#
# Two passes. Vale's exit code covers everything at or above MinAlertLevel,
# with no way to print a class of finding without failing on it, so the first
# pass shows every warning and the second decides the outcome. Only errors —
# misspellings and wrong-cased terms — block. Passive voice is a judgement
# call a reviewer makes, not something that should stop a build.
run = [
  "vale --no-exit docs/guide docs/articles site/src/content/docs/index.mdx site/src/content/docs/_drafts",
  "vale --minAlertLevel=error docs/guide docs/articles site/src/content/docs/index.mdx site/src/content/docs/_drafts",
]

[tasks.docs-links]
description = "Check every internal link in the built site resolves to a served page"
# The sync step checks that a link's target file exists in the repository.
# This checks that the URL it emitted is one the site actually serves — a
# different question, and the only one a reader experiences.
depends = ["docs-build"]
run = "uv run python scripts/check-site-links.py"

[tasks.docs-check]
description = "Full documentation gate — prose lint, astro check, site build, link check"
depends = ["docs-vale", "docs-links"]

[tasks.docs-clean]
description = "Remove site build artefacts and synced content"
run = "rm -rf site/dist site/.astro site/src/content/docs/{guide,articles,reference,spec,research}"

[tasks.derive-dark-logo]
description = "Regenerate site/src/assets/mdd-logo-dark.png from assets/mdd-logo.png"
run = "uv run python scripts/derive-dark-logo.py"
