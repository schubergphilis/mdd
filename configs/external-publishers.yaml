# configs/external-publishers.yaml — committed; canonical pattern library
# Spec S26: externally-managed Confluence pages.
#
# Some Confluence pages are generated by an upstream automation rather
# than edited by hand. `mdd` classifies those as externally-managed so a
# sync never proposes overwriting them, and so a human who opens the
# mirror is told where the real source lives.
#
# Per-user overrides: ~/.config/mdd/external-publishers.yaml
# or ./configs/external-publishers.local.yaml
# Same merge semantics: additional entries are appended; account_ids lists
# are extended on matching publisher names.
#
# The entries below are illustrative — replace them with your own
# publishers. An empty file is valid and means "nothing is externally
# managed".

external_publishers:
  - name: docs-pipeline
    # The Atlassian account IDs the automation publishes under. A page
    # whose last editor is one of these is classified without needing a
    # body marker.
    account_ids:
      - "5e3f...replace-with-your-bot-account-id"
    # Regexes matched against the page body, for automations that publish
    # under a human's account.
    body_marker_patterns:
      - 'View source on GitLab.*docs-pipeline'
    source_url: https://gitlab.example.com/docs/docs-pipeline
    message: |
      This page is published by the docs-pipeline Sphinx automation.
      Edit the source RST in {source_url}; the next CI run will
      republish.

# Whole spaces owned by one publisher.
managed_spaces: []

# Page subtrees owned by one publisher, identified by their root page.
managed_subtrees: []
