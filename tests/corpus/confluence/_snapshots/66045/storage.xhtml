<h1>Plain table</h1>
<p>A 3x3 table with a header row, no merged cells, no inline
formatting in cells. The simplest table case.</p>
<table>
<thead>
<tr>
<th>Name</th>
<th>Role</th>
<th>Location</th>
</tr>
</thead>
<tbody>
<tr>
<td>Alice</td>
<td>Engineer</td>
<td>Amsterdam</td>
</tr>
<tr>
<td>Bob</td>
<td>Designer</td>
<td>Utrecht</td>
</tr>
<tr>
<td>Charlie</td>
<td>PM</td>
<td>Rotterdam</td>
</tr>
</tbody>
</table>
