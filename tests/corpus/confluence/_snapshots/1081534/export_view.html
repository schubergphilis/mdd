<h1 id="Macro—info-card-Macro—info-card">Macro — info-card</h1>
<p>The <code>info-card</code> macro renders an inline card preview of a linked resource. The body carries a fallback <code>&lt;a&gt;</code> element that browsers without the card renderer fall back to.</p>
<img class="wysiwyg-unknown-macro" src="https://markdown.atlassian.net/wiki/plugins/servlet/confluence/placeholder/unknown-macro?name=info-card&amp;locale=en_GB&amp;version=2" />
<p>A trailing paragraph confirms the fence releases block scope so the macro stands on its own line in storage.</p>
