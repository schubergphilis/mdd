<ac:structured-macro ac:name="tip" ac:schema-version="1" ac:local-id="984a8eec9252" ac:macro-id="2a264a85-6138-4603-bbe5-07e109ff5e73"><ac:rich-text-body><p local-id="ef5feda7a334">Tip macros highlight helpful suggestions. They render as a green callout in Confluence.</p><p local-id="2b24892abbce">The body can contain <strong>bold text</strong>, <em>emphasis</em>, and <code>inline code</code> like any paragraph.</p><p local-id="67c485342286">Round-trip should preserve the macro wrapper and all inline formatting within the body.</p></ac:rich-text-body></ac:structured-macro>
